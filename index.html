        const pad = 6;
        const bw = maxX - minX + 1;
        const bh = maxY - minY + 1;
        const scale = Math.min((64 - pad * 2) / bw, (64 - pad * 2) / bh);
        const dw = bw * scale;
        const dh = bh * scale;
        const ox = (64 - dw) / 2;
        const oy = (64 - dh) / 2;

        const temp = document.createElement('canvas');
        temp.width = w;
        temp.height = h;
        const tctx = temp.getContext('2d');
        const inverted = tctx.createImageData(w, h);
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            const b = (imageData.data[i] + imageData.data[i + 1] + imageData.data[i + 2]) / 3;
            const v = b < HANDWRITING_INK_BRIGHTNESS ? 255 : 0;
            inverted.data[i] = v;
            inverted.data[i + 1] = v;
            inverted.data[i + 2] = v;
            inverted.data[i + 3] = 255;
          }
        }
        tctx.putImageData(inverted, 0, 0);
        ctx.drawImage(temp, minX, minY, bw, bh, ox, oy, dw, dh);
        return prep;
      };

      const load = async () => {
        if (model) return model;
        if (loadPromise) return loadPromise;
        loadPromise = (async () => {
          if (typeof tf === 'undefined') throw new Error('TensorFlow.js が読み込めません');
          getLabels();
          model = await tf.loadLayersModel(KANJI_MODEL_URL);
          return model;
        })();
        return loadPromise;
      };

      const recognize = async (canvas, expectedChar = null) => {
        await load();
        const labelMap = getLabels();
        if (!model || !labelMap || !canvasHasInk(canvas)) return null;

        const prep = prepareModelCanvas(canvas);
        let input = tf.browser.fromPixels(prep, 1);
        input = input.cast('float32').div(255).reshape([1, 64, 64, 1]);
        const output = model.predict(input);
        const probs = await output.data();
        output.dispose();
        input.dispose();

        const ranked = [];
        for (let i = 0; i < probs.length; i++) {
          ranked.push({ char: labelMap[i], confidence: probs[i] * 100, index: i });
        }
        ranked.sort((a, b) => b.confidence - a.confidence);

        const top5 = ranked.slice(0, 5);
        let chosen = ranked[0];
        if (expectedChar) {
          const matchInTop5 = top5.find((c) => c.char === expectedChar);
          if (matchInTop5) chosen = matchInTop5;
        }

        return {
          char: chosen.char,
          confidence: chosen.confidence,
          top3: ranked.slice(0, 3),
        };
      };

      const recognizeSlots = async (canvases, expectedChars) => {
        const recognitions = [];
        for (let i = 0; i < expectedChars.length; i++) {
          recognitions.push(canvases[i] ? await recognize(canvases[i], expectedChars[i]) : null);
        }
        const allHaveInk = recognitions.every((r) => r !== null);
        const allMatch = expectedChars.every((ch, i) => recognitions[i]?.char === ch);
        return { recognitions, allHaveInk, allMatch };
      };

      return { load, recognize, recognizeSlots, canvasHasInk };
    })();

    const PEN_WIDTH = 4;

    function App() {
      const savedState = useRef(loadSavedState()).current;

      const [view, setView] = useState('quiz');
      const [problemSetId, setProblemSetId] = useState(() => {
        const id = savedState?.problemSetId ?? DEFAULT_PROBLEM_SET_ID;
        return PROBLEM_SET_MAP[id] ? id : DEFAULT_PROBLEM_SET_ID;
      });
      const [showSetPicker, setShowSetPicker] = useState(false);
      const [mode, setMode] = useState(() => savedState?.mode ?? 'writing');
      const [currentQuestion, setCurrentQuestion] = useState(null);
      const [readingInput, setReadingInput] = useState('');
      const [history, setHistory] = useState(() => migrateHistory(savedState?.history));

      const activeProblemSet = PROBLEM_SET_MAP[problemSetId] ?? PROBLEM_SETS[0];
      const getActiveLists = () => ({
        writing: activeProblemSet.writing,
        reading: activeProblemSet.reading,
      });
      const [excludeCorrect, setExcludeCorrect] = useState(() => savedState?.excludeCorrect ?? true);
      const [hideRecoveredFromIncorrect, setHideRecoveredFromIncorrect] = useState(
        () => savedState?.hideRecoveredFromIncorrect ?? true
      );
      const [showCanvas, setShowCanvas] = useState(() => savedState?.showCanvas ?? true);
      const [showAnswer, setShowAnswer] = useState(false);
      const [result, setResult] = useState(null);
      const [writingStatus, setWritingStatus] = useState('idle');
      const [filterTab, setFilterTab] = useState('unanswered');

      const canvasRefs = useRef([]);
      const containerRefs = useRef([]);
      const isDrawingRef = useRef(false);
      const activeCanvasIndexRef = useRef(0);
      const showAnswerRef = useRef(false);
      const resultMarkTimerRef = useRef(null);
      const gradedRef = useRef(false);
      const currentQuestionRef = useRef(null);
      const passRevealedRef = useRef(false);
      const passMissRecordedRef = useRef(false);
      const evaluateTimerRef = useRef(null);
      const evaluateGenerationRef = useRef(0);
      const retryModeRef = useRef(false);
      const wrongSlotIndicesRef = useRef([]);
      const EVALUATE_DELAY_MS = 500;
      const [isDrawing, setIsDrawing] = useState(false);
      const [judgmentInfo, setJudgmentInfo] = useState(null);
      const [showPassAnswer, setShowPassAnswer] = useState(false);
      const [passPracticeMode, setPassPracticeMode] = useState(false);
      const [retryMode, setRetryMode] = useState(false);
      const [wrongSlotIndices, setWrongSlotIndices] = useState([]);
      const [modelReady, setModelReady] = useState(false);
      const [modelError, setModelError] = useState(null);
      const [charSlots, setCharSlots] = useState([]);
      const [activeCharPage, setActiveCharPage] = useState(0);

      useEffect(() => {
        showAnswerRef.current = showAnswer;
      }, [showAnswer]);

      const clearResultMarkTimer = () => {
        if (resultMarkTimerRef.current) {
          clearTimeout(resultMarkTimerRef.current);
          resultMarkTimerRef.current = null;
        }
      };

      const showIncorrectMarkBriefly = () => {
        clearResultMarkTimer();
        setResult('incorrect');
        resultMarkTimerRef.current = setTimeout(() => {
          setResult(null);
          resultMarkTimerRef.current = null;
        }, 1000);
      };

      const showSlotCorrectMarkBriefly = () => {
        clearResultMarkTimer();
        setResult('slot-correct');
        resultMarkTimerRef.current = setTimeout(() => {
          setResult(null);
          resultMarkTimerRef.current = null;
        }, 1000);
      };

      const isRetrySlotCorrect = (recognitions, canvases, expected, index) => (
        recognitions[index] !== null
        && recognitions[index].char === expected[index]
        && KanjiRecognizer.canvasHasInk(canvases[index])
      );

      useEffect(() => {
        retryModeRef.current = retryMode;
      }, [retryMode]);

      useEffect(() => {
        wrongSlotIndicesRef.current = wrongSlotIndices;
      }, [wrongSlotIndices]);

      const passPracticeModeRef = useRef(false);
      useEffect(() => {
        passPracticeModeRef.current = passPracticeMode;
      }, [passPracticeMode]);

      useEffect(() => {
        KanjiRecognizer.load()
          .then(() => setModelReady(true))
          .catch((err) => setModelError(err.message || 'モデルの読み込みに失敗しました'));
      }, []);

      useEffect(() => {
        currentQuestionRef.current = currentQuestion;
        if (currentQuestion && mode === 'writing') {
          const chars = splitKanjiChars(currentQuestion.kanji);
          setCharSlots(chars);
          const yomi = Array.isArray(currentQuestion.yomi) ? currentQuestion.yomi[0] : currentQuestion.yomi;
          setJudgmentInfo({
            targetKanji: currentQuestion.kanji,
            yomi,
            slots: chars.map((ch, i) => ({ index: i, expected: ch, recognized: null, confidence: null })),
            recognizedText: '—'.repeat(chars.length),
          });
        }
        setShowPassAnswer(false);
        setPassPracticeMode(false);
        setRetryMode(false);
        setWrongSlotIndices([]);
        setActiveCharPage(0);
        passRevealedRef.current = false;
        passMissRecordedRef.current = false;
      }, [currentQuestion, mode]);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            history,
            excludeCorrect,
            mode,
            showCanvas,
            hideRecoveredFromIncorrect,
            problemSetId,
          }));
        } catch (_) {}
      }, [history, excludeCorrect, mode, showCanvas, hideRecoveredFromIncorrect, problemSetId]);

      const selectProblemSet = (id) => {
        if (!PROBLEM_SET_MAP[id] || id === problemSetId) {
          setShowSetPicker(false);
          return;
        }
        clearResultMarkTimer();
        setProblemSetId(id);
        setShowSetPicker(false);
        setView('quiz');
        setCurrentQuestion(null);
        setResult(null);
        setShowAnswer(false);
        setWritingStatus('idle');
        setShowPassAnswer(false);
        setPassPracticeMode(false);
        setRetryMode(false);
        setWrongSlotIndices([]);
        passRevealedRef.current = false;
        passMissRecordedRef.current = false;
        gradedRef.current = false;
        cancelScheduledEvaluation();
        setReadingInput('');
      };

      const getDisplayYomi = (question) => {
        if (!question || !question.yomi) return '';
        return Array.isArray(question.yomi) ? question.yomi.join(' / ') : question.yomi;
      };

      const getEffectiveMissCount = (id) => {
        const record = history[id];
        if (!record) return 0;
        return Math.max(record.missCount, record.status === 'incorrect' ? 1 : 0);
      };

      const getMissBadgeClass = (count) => {
        if (count >= 5) return 'bg-red-900 border-red-950 text-white';
        if (count >= 4) return 'bg-red-800 border-red-900 text-white';
        if (count >= 3) return 'bg-red-700 border-red-800 text-white';
        if (count >= 2) return 'bg-red-500 border-red-600 text-white';
        return 'bg-red-100 border-red-300 text-red-800';
      };

      const moveToNextQuestion = (currentHistory) => {
        clearResultMarkTimer();
        setResult(null);
        setShowAnswer(false);
        setWritingStatus('idle');
        setShowPassAnswer(false);
        setPassPracticeMode(false);
        setRetryMode(false);
        setWrongSlotIndices([]);
        setActiveCharPage(0);
        passRevealedRef.current = false;
        passMissRecordedRef.current = false;
        gradedRef.current = false;
        cancelScheduledEvaluation();
        setReadingInput('');
        
        if (mode === 'writing' && showCanvas && view === 'quiz') {
          initAllCanvases();
        }

        const { writing, reading } = getActiveLists();
        const list = mode === 'writing' ? writing : reading;
        let availableList = list;
        
        if (excludeCorrect) {
          availableList = list.filter(item => currentHistory[item.id]?.status !== 'correct');
        }
        
        if (availableList.length === 0) {
          setCurrentQuestion(null);
          return;
        }

        const randomIndex = Math.floor(Math.random() * availableList.length);
        setCurrentQuestion(availableList[randomIndex]);
      };

      useEffect(() => {
        moveToNextQuestion(history);
      }, [mode, excludeCorrect, problemSetId]);

      const initCanvasAt = (index) => {
        const canvas = canvasRefs.current[index];
        const container = containerRefs.current[index];
        if (!canvas || !container) return;
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = PEN_WIDTH;
        ctx.strokeStyle = '#2d3748';
      };

      const drawGuideChar = (ctx, canvas, char) => {
        const size = Math.min(canvas.width, canvas.height) * 0.72;
        ctx.save();
        ctx.fillStyle = 'rgba(180, 180, 180, 0.32)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = `${size}px "Zen Kaku Gothic New", sans-serif`;
        ctx.fillText(char, canvas.width / 2, canvas.height / 2);
        ctx.restore();
      };

      const initCanvasWithGuide = (index, char) => {
        initCanvasAt(index);
        const canvas = canvasRefs.current[index];
        if (!canvas || !char) return;
        drawGuideChar(canvas.getContext('2d'), canvas, char);
      };

      const initAllCanvases = () => {
        charSlots.forEach((ch, i) => {
          if (passPracticeModeRef.current) initCanvasWithGuide(i, ch);
          else initCanvasAt(i);
        });
      };

      const formatJudgmentInfo = (recognitions, question) => {
        const expected = splitKanjiChars(question.kanji);
        const yomi = Array.isArray(question.yomi) ? question.yomi[0] : question.yomi;
        const slots = expected.map((ch, i) => {
          const rec = recognitions[i];
          return {
            index: i,
            expected: ch,
            recognized: rec?.char ?? null,
            confidence: rec ? Math.round(rec.confidence * 10) / 10 : null,
          };
        });
        const recognizedText = slots.map((s) => s.recognized ?? '？').join('');
        return { targetKanji: question.kanji, yomi, slots, recognizedText };
      };

      const refreshJudgmentInfo = async () => {
        const question = currentQuestionRef.current;
        if (!question || !modelReady) return;
        const expected = splitKanjiChars(question.kanji);
        const canvases = expected.map((_, i) => canvasRefs.current[i]);
        const { recognitions } = await KanjiRecognizer.recognizeSlots(canvases, expected);
        setJudgmentInfo(formatJudgmentInfo(recognitions, question));
      };

      useEffect(() => {
        const handleResize = () => {
          if (view === 'quiz' && mode === 'writing' && showCanvas) initAllCanvases();
        };
        window.addEventListener('resize', handleResize);
        if (view === 'quiz' && mode === 'writing' && showCanvas && charSlots.length > 0) {
          requestAnimationFrame(() => initAllCanvases());
        }
        return () => window.removeEventListener('resize', handleResize);
      }, [view, mode, showCanvas, currentQuestion?.id, charSlots.length, modelReady]);

      const getCoordinates = (e, canvasIndex) => {
        const canvas = canvasRefs.current[canvasIndex];
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const point = e.touches?.length ? e.touches[0] : e.changedTouches?.length ? e.changedTouches[0] : e;
        return {
          x: (point.clientX - rect.left) * scaleX,
          y: (point.clientY - rect.top) * scaleY,
        };
      };

      const cancelScheduledEvaluation = () => {
        if (evaluateTimerRef.current) {
          clearTimeout(evaluateTimerRef.current);
          evaluateTimerRef.current = null;
        }
      };

      const schedulePostDrawEvaluation = () => {
        cancelScheduledEvaluation();
        const generation = ++evaluateGenerationRef.current;
        evaluateTimerRef.current = setTimeout(async () => {
          evaluateTimerRef.current = null;
          if (generation !== evaluateGenerationRef.current) return;
          if (gradedRef.current || passRevealedRef.current || !modelReady) return;
          await refreshJudgmentInfo();
          if (generation !== evaluateGenerationRef.current) return;
          evaluateHandwriting({ allowCorrect: true });
        }, EVALUATE_DELAY_MS);
      };

      const evaluateHandwriting = async ({ allowCorrect = false, allowIncorrect = false } = {}) => {
        if (gradedRef.current || passRevealedRef.current || mode !== 'writing' || !modelReady) return;
        const question = currentQuestionRef.current;
        if (!question) return;

        const expected = splitKanjiChars(question.kanji);
        const canvases = expected.map((_, i) => canvasRefs.current[i]);
        const { recognitions, allHaveInk, allMatch } = await KanjiRecognizer.recognizeSlots(canvases, expected);
        setJudgmentInfo(formatJudgmentInfo(recognitions, question));

        if (!allHaveInk && !allowIncorrect) {
          setWritingStatus('idle');
          return;
        }

        if (retryModeRef.current && (allowCorrect || allowIncorrect)) {
          const wrongIndices = wrongSlotIndicesRef.current;
          if (wrongIndices.length === 0) return;

          const slotCorrect = (i) => isRetrySlotCorrect(recognitions, canvases, expected, i);
          const allWrongFixed = wrongIndices.every(slotCorrect);

          if (allowCorrect && wrongIndices.some(slotCorrect)) {
            showSlotCorrectMarkBriefly();
          }

          if (allowIncorrect) {
            if (allWrongFixed) {
              moveToNextQuestion(history);
            } else {
              passRevealedRef.current = true;
              setShowPassAnswer(true);
            }
          }
          return;
        }

        if (allowCorrect && !gradedRef.current) {
          if (!allMatch) return;
          gradedRef.current = true;
          setRetryMode(false);
          setPassPracticeMode(false);
          setWrongSlotIndices([]);
          setWritingStatus('correct');
          setResult('correct');
          setHistory((prev) => {
            const currentData = prev[question.id] || { missCount: 0 };
            const nextHistory = {
              ...prev,
              [question.id]: { status: 'correct', missCount: currentData.missCount },
            };
            setTimeout(() => moveToNextQuestion(nextHistory), 1000);
            return nextHistory;
          });
          return;
        }

        if (allowIncorrect && (!allMatch || !allHaveInk)) {
          const wrongIndices = expected
            .map((ch, i) => (recognitions[i]?.char === ch ? -1 : i))
            .filter((i) => i >= 0);

          showIncorrectMarkBriefly();
          setWritingStatus('wrong');
          setRetryMode(true);
          setWrongSlotIndices(wrongIndices);
          if (wrongIndices.length > 0) setActiveCharPage(wrongIndices[0]);
          wrongIndices.forEach((i) => initCanvasAt(i));

          const canvasesAfterClear = expected.map((_, i) => canvasRefs.current[i]);
          const { recognitions: recAfter } = await KanjiRecognizer.recognizeSlots(canvasesAfterClear, expected);
          setJudgmentInfo(formatJudgmentInfo(recAfter, question));

          if (!passMissRecordedRef.current) {
            passMissRecordedRef.current = true;
            setHistory((prev) => {
              const currentData = prev[question.id] || { missCount: 0 };
              return {
                ...prev,
                [question.id]: { status: 'incorrect', missCount: currentData.missCount + 1 },
              };
            });
          }
        }
      };

      const startDrawing = (e, canvasIndex) => {
        if (gradedRef.current || (passRevealedRef.current && !passPracticeModeRef.current) || !modelReady) return;
        if (retryModeRef.current && wrongSlotIndices.length > 0 && !wrongSlotIndices.includes(canvasIndex)) return;
        cancelScheduledEvaluation();
        evaluateGenerationRef.current++;
        e.preventDefault?.();
        activeCanvasIndexRef.current = canvasIndex;
        const { x, y } = getCoordinates(e, canvasIndex);
        const ctx = canvasRefs.current[canvasIndex].getContext('2d');
        ctx.lineWidth = PEN_WIDTH;
        ctx.beginPath();
        ctx.moveTo(x, y);
        isDrawingRef.current = true;
        setIsDrawing(true);
      };

      const draw = (e, canvasIndex) => {
        if (!isDrawingRef.current || activeCanvasIndexRef.current !== canvasIndex) return;
        if (gradedRef.current || (passRevealedRef.current && !passPracticeModeRef.current)) return;
        e.preventDefault?.();
        const { x, y } = getCoordinates(e, canvasIndex);
        const ctx = canvasRefs.current[canvasIndex].getContext('2d');
        ctx.lineTo(x, y);
        ctx.stroke();
      };

      const stopDrawing = (canvasIndex) => {
        if (!isDrawingRef.current || activeCanvasIndexRef.current !== canvasIndex) return;
        const ctx = canvasRefs.current[canvasIndex].getContext('2d');
        ctx.closePath();
        isDrawingRef.current = false;
        setIsDrawing(false);
        schedulePostDrawEvaluation();
      };

      const handleCanvasTouchStart = (e, canvasIndex) => {
        if (gradedRef.current || (passRevealedRef.current && !passPracticeModeRef.current)) return;
        e.preventDefault();
        startDrawing(e, canvasIndex);
      };

      const handleCanvasTouchMove = (e, canvasIndex) => {
        if (!isDrawingRef.current) return;
        e.preventDefault();
        draw(e, canvasIndex);
      };

      const handleCanvasTouchEnd = (e, canvasIndex) => {
        e.preventDefault();
        stopDrawing(canvasIndex);
      };

      useEffect(() => {
        if (!isDrawing) return;
        const prevOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        return () => { document.body.style.overflow = prevOverflow; };
      }, [isDrawing]);

      useEffect(() => () => {
        cancelScheduledEvaluation();
        clearResultMarkTimer();
      }, []);

      const clearCanvasAt = async (index) => {
        if (gradedRef.current || (passRevealedRef.current && !passPracticeModeRef.current)) return;
        clearResultMarkTimer();
        setResult(null);
        cancelScheduledEvaluation();
        evaluateGenerationRef.current++;
        if (passPracticeModeRef.current) initCanvasWithGuide(index, charSlots[index]);
        else initCanvasAt(index);
        if (!retryModeRef.current) {
          setWritingStatus('idle');
        }
        await refreshJudgmentInfo();
      };

      const enterPassPracticeMode = () => {
        const question = currentQuestionRef.current;
        if (!question) return;
        cancelScheduledEvaluation();
        evaluateGenerationRef.current++;

        const expected = splitKanjiChars(question.kanji);
        if (!passMissRecordedRef.current) {
          passMissRecordedRef.current = true;
          setHistory((prev) => {
            const currentData = prev[question.id] || { missCount: 0 };
            return {
              ...prev,
              [question.id]: { status: 'incorrect', missCount: currentData.missCount + 1 },
            };
          });
        }

        passRevealedRef.current = false;
        setShowPassAnswer(false);
        setPassPracticeMode(true);
        clearResultMarkTimer();
        setResult(null);
        setWritingStatus('pass_retry');
        setRetryMode(true);
        setWrongSlotIndices(expected.map((_, i) => i));
        setActiveCharPage(0);
        requestAnimationFrame(() => {
          expected.forEach((ch, i) => initCanvasWithGuide(i, ch));
          refreshJudgmentInfo();
        });
      };

      const handlePass = () => {
        if (gradedRef.current || !modelReady) return;
        if (passPracticeMode) {
          handlePassNext();
          return;
        }
        if (retryModeRef.current) {
          cancelScheduledEvaluation();
          evaluateGenerationRef.current++;
          evaluateHandwriting({ allowCorrect: true, allowIncorrect: true });
          return;
        }
        enterPassPracticeMode();
      };

      const handlePassNext = () => {
        moveToNextQuestion(history);
      };

      const goToCharPage = (index) => {
        if (index < 0 || index >= charSlots.length) return;
        setActiveCharPage(index);
      };

      const getSlotPageStatus = (index) => {
        const slot = judgmentInfo?.slots?.[index];
        if (!slot) return 'pending';
        if (slot.recognized === slot.expected && slot.recognized) return 'correct';
        if (wrongSlotIndices.includes(index)) return 'wrong';
        if (writingStatus === 'wrong' && slot.recognized && slot.recognized !== slot.expected) return 'wrong';
        if (slot.recognized && slot.recognized !== slot.expected) return 'wrong';
        return 'pending';
      };

      const handleCheckReading = () => {
        const normalizedInput = readingInput.trim().replace(/[\s　]/g, '');
        const isCorrect = Array.isArray(currentQuestion.yomi) 
          ? currentQuestion.yomi.includes(normalizedInput)
          : currentQuestion.yomi === normalizedInput;
        const gradeResult = isCorrect ? 'correct' : 'incorrect';
        
        if (gradeResult === 'incorrect') showIncorrectMarkBriefly();
        else setResult('correct');
        setHistory(prev => {
          const currentData = prev[currentQuestion.id] || { missCount: 0 };
          const newMissCount = gradeResult === 'incorrect' ? currentData.missCount + 1 : currentData.missCount;
          return { 
            ...prev, 
            [currentQuestion.id]: { status: gradeResult, missCount: newMissCount } 
          };
        });
        setShowAnswer(true);
      };

      const handleNextClick = () => {
        moveToNextQuestion(history);
      };

      const renderSentence = () => {
        if (!currentQuestion) return null;
        const parts = currentQuestion.sentence.split('{target}');
        const targetText = mode === 'writing'
          ? getDisplayYomi(currentQuestion)
          : getReadingTargetDisplay(currentQuestion);
        
        return (
          <div className="text-xl md:text-2xl tracking-widest mb-8 text-center text-gray-800 leading-relaxed animate-fade-in">
            {parts[0]}
            <span className="font-bold border-b-2 border-gray-900 px-2 mx-1 text-2xl md:text-3xl text-gray-900 inline-block min-w-[80px]">
              {targetText}
            </span>
            {parts[1]}
          </div>
        );
      };

      const renderAllClear = () => (
        <div className="p-10 flex flex-col items-center justify-center min-h-[400px] text-center animate-fade-in">
          <div className="mb-6">
            <svg className="w-24 h-24 text-gray-900 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
            </svg>
          </div>
          <h2 className="text-2xl font-bold tracking-widest text-gray-900 mb-4">全問クリア！</h2>
          <p className="text-gray-600 mb-8 leading-relaxed text-sm">
            設定した条件で出題できる問題は<br/>もうありません。
          </p>
          <div className="space-y-4 w-full max-w-xs">
            <button onClick={() => setExcludeCorrect(false)} className="w-full py-4 bg-gray-900 text-white font-bold tracking-widest hover:bg-gray-800 transition-colors shadow-md">
              全問から出題する
            </button>
            <button onClick={() => {
              const prefix = `${problemSetId}:`;
              setHistory((prev) => {
                const next = { ...prev };
                Object.keys(next).forEach((k) => { if (k.startsWith(prefix)) delete next[k]; });
                return next;
              });
              moveToNextQuestion({});
            }} className="w-full py-4 bg-white border-2 border-gray-300 text-gray-700 font-bold tracking-widest hover:bg-gray-50 transition-colors">
              この問題集の履歴をリセット
            </button>
          </div>
        </div>
      );

      const renderListView = () => {
        const { writing: writingData, reading: readingData } = getActiveLists();
        const isIncorrectListItem = (record) => {
          if (!record) return false;
          const hasMiss = record.status === 'incorrect' || record.missCount > 0;
          if (!hasMiss) return false;
          if (hideRecoveredFromIncorrect && record.status === 'correct') return false;
          return true;
        };

        const filterFunc = (item) => {
          const record = history[item.id];
          if (filterTab === 'unanswered') return !record;
          if (filterTab === 'incorrect') return isIncorrectListItem(record);
          if (filterTab === 'correct') return record && record.status === 'correct';
          return true;
        };

        const sortByMissCount = (list) => {
          if (filterTab !== 'incorrect') return list;
          return [...list].sort((a, b) => getEffectiveMissCount(b.id) - getEffectiveMissCount(a.id));
        };

        const filteredWriting = sortByMissCount(writingData.filter(filterFunc));
        const filteredReading = sortByMissCount(readingData.filter(filterFunc));

        const countTotal = (dataList, type) => {
          return dataList.filter(item => {
            const record = history[item.id];
            if (type === 'unanswered') return !record;
            if (type === 'incorrect') return isIncorrectListItem(record);
            if (type === 'correct') return record && record.status === 'correct';
            return false;
          }).length;
        };

        const writingCount = {
          unanswered: countTotal(writingData, 'unanswered'),
          incorrect: countTotal(writingData, 'incorrect'),
          correct: countTotal(writingData, 'correct')
        };

        const readingCount = {
          unanswered: countTotal(readingData, 'unanswered'),
          incorrect: countTotal(readingData, 'incorrect'),
          correct: countTotal(readingData, 'correct')
        };

        return (
          <div className="p-4 md:p-6 flex flex-col min-h-[500px] animate-fade-in text-gray-900">
            <div className="flex justify-between items-center mb-5">
              <button onClick={() => setView('quiz')} className="text-gray-500 hover:text-gray-900 flex items-center gap-2 font-bold tracking-widest transition-colors text-sm">
                <IconArrowLeft /> 戻る
              </button>
              <h2 className="text-md font-bold tracking-widest text-gray-900">問題一覧・学習設定</h2>
            </div>

            <div className="mb-5 p-4 bg-gray-50 border border-gray-200 rounded-lg space-y-3">
              <label className="flex items-center gap-3 cursor-pointer select-none">
                <input type="checkbox" checked={excludeCorrect} onChange={(e) => setExcludeCorrect(e.target.checked)} className="w-5 h-5 text-gray-900 bg-white border-gray-300 rounded focus:ring-gray-900 focus:ring-offset-0"/>
                <span className="text-gray-900 font-bold tracking-wide text-sm">正解した問題は出題しない</span>
              </label>
              <label className="flex items-center gap-3 cursor-pointer select-none">
                <input type="checkbox" checked={hideRecoveredFromIncorrect} onChange={(e) => setHideRecoveredFromIncorrect(e.target.checked)} className="w-5 h-5 text-gray-900 bg-white border-gray-300 rounded focus:ring-gray-900 focus:ring-offset-0"/>
                <span className="text-gray-900 font-bold tracking-wide text-sm">後に正解した問題を「間違えた」一覧から除外</span>
              </label>
            </div>

            <div className="flex border-b border-gray-300 mb-5 bg-[#fafafa] rounded-t-md">
              <button onClick={() => setFilterTab('unanswered')} className={`flex-1 py-3 text-xs tracking-wider transition-colors font-bold border-b-2 flex flex-col items-center justify-center gap-1 ${filterTab === 'unanswered' ? 'border-gray-900 text-gray-900 bg-white' : 'border-transparent text-gray-500 hover:bg-gray-100'}`}>
                <span>未回答</span>
                <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-gray-200 text-gray-700 font-medium">{writingCount.unanswered + readingCount.unanswered}</span>
              </button>
              <button onClick={() => setFilterTab('incorrect')} className={`flex-1 py-3 text-xs tracking-wider transition-colors font-bold border-b-2 flex flex-col items-center justify-center gap-1 ${filterTab === 'incorrect' ? 'border-gray-900 text-gray-900 bg-white' : 'border-transparent text-gray-500 hover:bg-gray-100'}`}>
                <span>間違えた</span>
                <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-red-100 text-red-700 font-medium">{writingCount.incorrect + readingCount.incorrect}</span>
              </button>
              <button onClick={() => setFilterTab('correct')} className={`flex-1 py-3 text-xs tracking-wider transition-colors font-bold border-b-2 flex flex-col items-center justify-center gap-1 ${filterTab === 'correct' ? 'border-gray-900 text-gray-900 bg-white' : 'border-transparent text-gray-500 hover:bg-gray-100'}`}>
                <span>正解した</span>
                <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-green-100 text-green-700 font-medium">{writingCount.correct + readingCount.correct}</span>
              </button>
            </div>

            <div className="flex-1 max-h-[380px] overflow-y-auto pr-1 space-y-6 scrollbar-thin">
              <div>
                <h3 className="font-bold text-gray-900 border-b border-gray-200 pb-1.5 mb-3 tracking-widest text-sm flex items-center justify-between">
                  <span>書き問題</span>
                  <span className="text-xs text-gray-500 font-normal">{filteredWriting.length} 件</span>
                </h3>
                {filteredWriting.length === 0 ? <p className="text-gray-400 text-xs text-center py-4">該当問題はありません。</p> : (
                  <ul className="space-y-1">
                    {filteredWriting.map(item => {
                      const record = history[item.id];
                      return (
                        <li key={item.id} className="flex justify-between items-center py-2.5 border-b border-gray-100 hover:bg-gray-50 px-2 rounded transition-colors text-sm">
                          <div className="flex-1 min-w-0 pr-2">
                            <span className="text-gray-500 text-xs block mb-0.5 truncate">{getDisplayYomi(item)}</span>
                            <span className="font-bold text-lg text-gray-900 tracking-wide">{item.kanji}</span>
                          </div>
                          <div className="flex items-center gap-2 justify-end shrink-0">
                            {(() => {
                              const miss = getEffectiveMissCount(item.id);
                              return miss > 0 ? (
                                <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded shadow-sm border ${getMissBadgeClass(miss)}`}>
                                  ミス {miss}回
                                </span>
                              ) : null;
                            })()}
                            <div className="w-6 flex justify-center shrink-0">
                              {record?.status === 'correct' && <IconCheckCircle />}
                            </div>
                          </div>
                        </li>
                      );
                    })}
                  </ul>
                )}
              </div>

              <div>
                <h3 className="font-bold text-gray-900 border-b border-gray-200 pb-1.5 mb-3 tracking-widest text-sm flex items-center justify-between">
                  <span>読み問題</span>
                  <span className="text-xs text-gray-500 font-normal">{filteredReading.length} 件</span>
                </h3>
                {filteredReading.length === 0 ? <p className="text-gray-400 text-xs text-center py-4">該当問題はありません。</p> : (
                  <ul className="space-y-1">
                    {filteredReading.map(item => {
                      const record = history[item.id];
                      return (
                        <li key={item.id} className="flex justify-between items-center py-2.5 border-b border-gray-100 hover:bg-gray-50 px-2 rounded transition-colors text-sm">
                          <div className="flex-1 min-w-0 pr-2">
                            <span className="font-bold text-lg text-gray-900 tracking-wide block mb-0.5">{item.kanji}</span>
                            <span className="text-gray-600 text-xs truncate block">{getDisplayYomi(item)}</span>
                          </div>
                          <div className="flex items-center gap-2 justify-end shrink-0">
                            {(() => {
                              const miss = getEffectiveMissCount(item.id);
                              return miss > 0 ? (
                                <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded shadow-sm border ${getMissBadgeClass(miss)}`}>
                                  ミス {miss}回
                                </span>
                              ) : null;
                            })()}
                            <div className="w-6 flex justify-center shrink-0">
                              {record?.status === 'correct' && <IconCheckCircle />}
                            </div>
                          </div>
                        </li>
                      );
                    })}
                  </ul>
                )}
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-[#f8f9fa] text-gray-800 p-4 flex justify-center items-start selection:bg-gray-200">
          <style>{`
            * { font-family: 'Zen Kaku Gothic New', sans-serif; }
            @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
            .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
            @keyframes scaleIn { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.85; } }
            .animate-scale-in { animation: scaleIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
            .scrollbar-thin::-webkit-scrollbar { width: 5px; }
            .scrollbar-thin::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 9px; }
            .canvas-draw-area { touch-action: none; overscroll-behavior: contain; -webkit-user-select: none; user-select: none; }
            .canvas-crosshair-v { position: absolute; left: 50%; top: 8%; height: 84%; border-left: 1px dashed #d1d5db; transform: translateX(-50%); pointer-events: none; }
            .canvas-crosshair-h { position: absolute; top: 50%; left: 8%; width: 84%; border-top: 1px dashed #d1d5db; transform: translateY(-50%); pointer-events: none; }
            .handwriting-pages-viewport { overflow: hidden; width: 100%; }
            .handwriting-pages-track { display: flex; transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1); will-change: transform; }
            .handwriting-page { flex: 0 0 100%; width: 100%; min-width: 100%; box-sizing: border-box; padding: 0 2px; }
            .handwriting-slot-box { width: 100%; max-width: min(100%, 320px); margin-left: auto; margin-right: auto; aspect-ratio: 1 / 1; min-height: min(72vw, 320px); }
          `}</style>

          <div className="w-full max-w-lg bg-white border border-gray-300 mt-2 md:mt-10 mb-10 relative overflow-hidden shadow-sm">
            <div className="p-4 border-b border-gray-300 flex justify-between items-center bg-white relative">
              <button
                type="button"
                onClick={() => setShowSetPicker((v) => !v)}
                className="w-10 h-10 flex items-center justify-center text-gray-500 hover:text-gray-900 hover:bg-gray-100 rounded-full transition-colors shrink-0"
                aria-label="問題集を選ぶ"
              >
                <IconNotebook />
              </button>
              <div className="text-center flex-1 min-w-0 px-1">
                <h1 className="text-xl tracking-widest font-bold text-gray-900">漢字練習</h1>
                <p className="text-[10px] text-gray-500 tracking-wide mt-0.5 truncate">{activeProblemSet.name}</p>
              </div>
              <button onClick={() => { setShowSetPicker(false); setView(view === 'list' ? 'quiz' : 'list'); }} className="w-10 h-10 flex items-center justify-center text-gray-500 hover:text-gray-900 hover:bg-gray-100 rounded-full transition-colors shrink-0">
                {view === 'list' ? <IconX /> : <IconList />}
              </button>
              {showSetPicker && (
                <>
                  <div className="fixed inset-0 z-40" onClick={() => setShowSetPicker(false)} aria-hidden="true" />
                  <div className="absolute left-2 top-full mt-1 z-50 w-52 bg-white border border-gray-300 shadow-lg rounded overflow-hidden">
                    <p className="px-3 py-2 text-[10px] text-gray-500 tracking-wide border-b border-gray-200 bg-[#fafafa]">問題集</p>
                    {PROBLEM_SETS.map((set) => (
                      <button
                        key={set.id}
                        type="button"
                        onClick={() => selectProblemSet(set.id)}
                        className={`w-full text-left px-4 py-3 text-sm tracking-wide transition-colors ${
                          problemSetId === set.id
                            ? 'bg-gray-900 text-white font-bold'
                            : 'text-gray-800 hover:bg-gray-50'
                        }`}
                      >
                        {set.name}
                        <span className={`block text-[10px] mt-0.5 font-normal ${problemSetId === set.id ? 'text-gray-300' : 'text-gray-400'}`}>
                          書き{set.writing.length}・読み{set.reading.length}
                        </span>
                      </button>
                    ))}
                  </div>
                </>
              )}
            </div>

            {view === 'list' ? renderListView() : (
              <>
                <div className="flex border-b border-gray-300 bg-[#fafafa]">
                  <button className={`flex-1 py-3 text-sm tracking-widest transition-colors flex items-center justify-center gap-2 ${mode === 'writing' ? 'border-b-2 border-gray-900 font-bold bg-white text-gray-900' : 'text-gray-500 hover:bg-gray-100'}`} onClick={() => setMode('writing')}>
                    <IconEdit2 /> 書き問題
                  </button>
                  <button className={`flex-1 py-3 text-sm tracking-widest transition-colors flex items-center justify-center gap-2 ${mode === 'reading' ? 'border-b-2 border-gray-900 font-bold bg-white text-gray-900' : 'text-gray-500 hover:bg-gray-100'}`} onClick={() => setMode('reading')}>
                    <IconType /> 読み問題
                  </button>
                </div>

                {!currentQuestion ? renderAllClear() : (
                  <div className="p-6 md:p-10 flex flex-col items-center min-h-[500px] relative animate-fade-in">
                    {(() => {
                      const miss = getEffectiveMissCount(currentQuestion.id);
                      if (miss <= 0) return null;
                      const posClass = mode === 'reading'
                        ? 'top-4 right-4 md:top-6 md:right-6'
                        : 'bottom-4 right-4 md:bottom-6 md:right-6';
                      return (
                        <span className={`absolute ${posClass} z-20 text-[10px] font-bold px-2 py-1 rounded shadow-sm border pointer-events-none ${getMissBadgeClass(miss)}`}>
                          ミス {miss}回
                        </span>
                      );
                    })()}

                    {mode === 'reading' ? (
                      <p className="text-gray-500 text-sm mb-6 tracking-wide text-center">
                        下線部の漢字の読みをひらがなで答えなさい。
                      </p>
                    ) : (
                      <p className="text-gray-500 text-sm mb-6 tracking-wide text-center">
                        下線部のひらがなを漢字で書きなさい。
                      </p>
                    )}

                    {renderSentence()}
                    
                    {result && (
                      <div className="absolute top-[40%] left-1/2 pointer-events-none z-10 animate-scale-in">
                        <GradeMark type={result} />
                      </div>
                    )}
                    
                    {mode === 'writing' ? (
                      <div className="w-full mb-4">
                        <div className="flex justify-end items-center gap-3 mb-2">
                          <button onClick={() => setShowCanvas(!showCanvas)} className="text-xs text-gray-500 hover:text-gray-900 flex items-center gap-1.5 p-1 shrink-0">
                            {showCanvas ? <IconPenOff /> : <IconPenOn />}
                            {showCanvas ? '手書きを隠す' : '手書きを開く'}
                          </button>
                        </div>
                        
                        {showCanvas && (
                          <div className="w-full relative animate-fade-in canvas-draw-area">
                            {!modelReady && !modelError && (
                              <p className="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded px-3 py-2 mb-2 text-center">
                                漢字認識モデルを読み込み中…
                              </p>
                            )}
                            {modelError && (
                              <p className="text-xs text-red-700 bg-red-50 border border-red-200 rounded px-3 py-2 mb-2 text-center">
                                {modelError}
                              </p>
                            )}
                            {charSlots.length > 1 && (
                              <div className="flex flex-wrap gap-1.5 justify-center mb-3">
                                {charSlots.map((char, index) => {
                                  const status = getSlotPageStatus(index);
                                  const isActive = index === activeCharPage;
                                  return (
                                    <button
                                      key={`tab-${index}`}
                                      type="button"
                                      onClick={() => goToCharPage(index)}
                                      className={`text-[10px] font-bold px-2 py-1 rounded border tracking-widest transition-colors ${
                                        isActive ? 'border-gray-900 bg-gray-900 text-white'
                                          : status === 'wrong' ? 'border-red-400 bg-red-50 text-red-800'
                                          : status === 'correct' ? 'border-green-400 bg-green-50 text-green-800'
                                          : 'border-gray-300 bg-white text-gray-600 hover:bg-gray-50'
                                      }`}
                                    >
                                      {index + 1}文字目
                                      {status === 'wrong' ? ' ×' : status === 'correct' ? ' ✓' : ''}
                                    </button>
                                  );
                                })}
                              </div>
                            )}

                            {charSlots.length > 1 && (
                              <div className="flex items-center justify-between gap-2 mb-3">
                                <button
                                  type="button"
                                  onClick={() => goToCharPage(activeCharPage - 1)}
                                  disabled={activeCharPage === 0}
                                  className="flex-1 py-2 text-xs font-bold tracking-widest border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed rounded"
                                >
                                  ‹ 前の文字
                                </button>
                                <span className="text-xs text-gray-600 font-bold tabular-nums shrink-0 px-1">
                                  {activeCharPage + 1} / {charSlots.length}
                                </span>
                                <button
                                  type="button"
                                  onClick={() => goToCharPage(activeCharPage + 1)}
                                  disabled={activeCharPage >= charSlots.length - 1}
                                  className="flex-1 py-2 text-xs font-bold tracking-widest border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed rounded"
                                >
                                  次の文字 ›
                                </button>
                              </div>
                            )}

                            <div className="handwriting-pages-viewport">
                              <div
                                className="handwriting-pages-track"
                                style={{ transform: `translateX(-${activeCharPage * 100}%)` }}
                              >
                                {charSlots.map((char, index) => {
                                  const slot = judgmentInfo?.slots?.[index];
                                  const isSlotMatch = slot?.recognized === slot?.expected;
                                  const pageStatus = getSlotPageStatus(index);
                                  const canDraw = modelReady && !gradedRef.current
                                    && (!passRevealedRef.current || passPracticeMode)
                                    && (!retryMode || passPracticeMode || wrongSlotIndices.length === 0 || wrongSlotIndices.includes(index));
                                  return (
                                    <div key={`${currentQuestion.id}-${index}`} className="handwriting-page flex flex-col">
                                      <p className="text-xs text-gray-600 text-center mb-2 tracking-widest font-bold">
                                        {charSlots.length > 1 ? `${index + 1}文字目` : '手書き'}
                                      </p>
                                      <div
                                        ref={(el) => { containerRefs.current[index] = el; }}
                                        className={`handwriting-slot-box relative border overflow-hidden ${
                                          result === 'correct' ? 'border-green-400'
                                            : pageStatus === 'wrong' ? 'border-red-400'
                                            : index === activeCharPage ? 'border-gray-900'
                                            : 'border-gray-400'
                                        }`}
                                      >
                                        <div className="absolute inset-0 z-[1] pointer-events-none">
                                          <span className="canvas-crosshair-v" />
                                          <span className="canvas-crosshair-h" />
                                        </div>
                                        <canvas
                                          ref={(el) => { canvasRefs.current[index] = el; }}
                                          className={`relative z-[2] block w-full h-full bg-white ${result === 'correct' ? 'opacity-70' : canDraw ? 'cursor-crosshair' : 'cursor-not-allowed opacity-60'}`}
                                          onMouseDown={(e) => canDraw && startDrawing(e, index)}
                                          onMouseMove={(e) => draw(e, index)}
                                          onMouseUp={() => stopDrawing(index)}
                                          onMouseLeave={() => stopDrawing(index)}
                                          onTouchStart={(e) => canDraw && handleCanvasTouchStart(e, index)}
                                          onTouchMove={(e) => handleCanvasTouchMove(e, index)}
                                          onTouchEnd={(e) => handleCanvasTouchEnd(e, index)}
                                          onTouchCancel={(e) => handleCanvasTouchEnd(e, index)}
                                        />
                                      </div>
                                      <p className={`text-xs text-center mt-2 tracking-widest tabular-nums ${isSlotMatch ? 'text-green-700 font-medium' : 'text-gray-700'}`}>
                                        認識: {slot?.recognized ?? '—'}
                                        {slot?.confidence != null && (
                                          <span className="text-[10px] text-gray-500 ml-1">({slot.confidence}%)</span>
                                        )}
                                      </p>
                                      {index === activeCharPage && result !== 'correct' && !showPassAnswer && (
                                        <button
                                          type="button"
                                          onClick={() => clearCanvasAt(index)}
                                          disabled={!modelReady}
                                          className="mt-2 w-full max-w-[320px] mx-auto py-2 text-[11px] text-gray-600 border border-gray-300 bg-white hover:bg-gray-50 tracking-wide disabled:opacity-50 disabled:cursor-not-allowed"
                                        >
                                          書き直し
                                        </button>
                                      )}
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                            {passPracticeMode && (
                              <p className="text-xs text-blue-800 bg-blue-50 border border-blue-200 rounded px-3 py-2 mt-3 text-center tracking-wide">
                                薄く表示された正解の漢字を参考に、もう一度書いてください。
                              </p>
                            )}
                            {retryMode && writingStatus === 'wrong' && !showPassAnswer && !passPracticeMode && (
                              <p className="text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded px-3 py-2 mt-3 text-center tracking-wide">
                                間違えた文字（赤いタブ）をもう一度書いてください。ボタンで該当の文字へ移れます。
                              </p>
                            )}
                            {showPassAnswer && (
                              <p className="text-xs text-blue-700 bg-blue-50 border border-blue-200 rounded px-3 py-2 mt-3 text-center tracking-wide">
                                不正解です。正解は「{currentQuestion.kanji}」です。
                              </p>
                            )}
                          </div>
                        )}
                      </div>
                    ) : (
                      <div className="w-full mb-8">
                        <input 
                          type="text" 
                          value={readingInput}
                          onChange={(e) => setReadingInput(e.target.value)}
                          onKeyDown={(e) => e.key === 'Enter' && !showAnswer && handleCheckReading()}
                          className="w-full border-b-2 border-gray-300 p-4 text-2xl tracking-widest text-center focus:outline-none focus:border-gray-900 bg-transparent"
                          placeholder="ひらがなを入力"
                          disabled={showAnswer}
                          autoFocus
                        />
                      </div>
                    )}

                    <div className="w-full mt-auto">
                      {mode === 'writing' && showPassAnswer && (
                        <div className="w-full animate-fade-in mb-4">
                          <div className="text-center mb-4">
                            <p className="text-sm text-gray-500 mb-1">正解</p>
                            <p className="text-5xl font-bold tracking-widest text-gray-900">{currentQuestion.kanji}</p>
                          </div>
                          <button
                            onClick={handlePassNext}
                            className="w-full py-4 bg-white border-2 border-gray-900 text-gray-900 font-bold tracking-widest flex items-center justify-center gap-3"
                          >
                            次の問題へ <IconArrowRight />
                          </button>
                        </div>
                      )}

                      {mode === 'writing' && result !== 'correct' && !showPassAnswer && (
                        <button
                          onClick={handlePass}
                          disabled={!modelReady}
                          className="w-full py-4 bg-white border-2 border-gray-300 text-gray-600 font-bold tracking-widest hover:bg-gray-50 hover:border-gray-400 disabled:opacity-50 disabled:cursor-not-allowed"
                        >
                          {passPracticeMode ? 'スキップして次へ' : retryMode ? '答えを見て次へ' : 'パス'}
                        </button>
                      )}

                      {mode === 'reading' && !showAnswer && (
                        <button onClick={handleCheckReading} disabled={!readingInput.trim()} className="w-full py-4 bg-gray-900 text-white font-bold tracking-widest hover:bg-gray-800 disabled:bg-gray-300 disabled:text-gray-500 shadow-md">
                          判定する
                        </button>
                      )}

                      {mode === 'reading' && showAnswer && (
                        <div className="w-full animate-fade-in">
                          <div className="text-center mb-6">
                            <p className="text-sm text-gray-500 mb-1">正解</p>
                            <p className="text-2xl font-bold tracking-widest text-gray-900">{getDisplayYomi(currentQuestion)}</p>
                          </div>
                          <button onClick={handleNextClick} className="w-full py-4 bg-white border-2 border-gray-900 text-gray-900 font-bold tracking-widest flex items-center justify-center gap-3">
                            次の問題へ <IconArrowRight />
                          </button>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
