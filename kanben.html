    function App() {
      const savedState = useRef(loadSavedState()).current;

      const [view, setView] = useState('quiz');
      const [mode, setMode] = useState(() => savedState?.mode ?? 'writing');
      const [currentQuestion, setCurrentQuestion] = useState(null);
      const [readingInput, setReadingInput] = useState('');
      const [history, setHistory] = useState(() => savedState?.history ?? {});
      const [excludeCorrect, setExcludeCorrect] = useState(() => savedState?.excludeCorrect ?? true);
      const [hideRecoveredFromIncorrect, setHideRecoveredFromIncorrect] = useState(
        () => savedState?.hideRecoveredFromIncorrect ?? true
      );
      const [showCanvas, setShowCanvas] = useState(() => savedState?.showCanvas ?? true);
      const [penWidth, setPenWidth] = useState(() => savedState?.penWidth ?? 8);
      const [showAnswer, setShowAnswer] = useState(false);
      const [result, setResult] = useState(null);
      const [writingRetry, setWritingRetry] = useState(false);
      const [filterTab, setFilterTab] = useState('unanswered');

      const canvasRef = useRef(null);
      const containerRef = useRef(null);
      const isDrawingRef = useRef(false);
      const showAnswerRef = useRef(false);
      const writingRetryRef = useRef(false);
      const penWidthRef = useRef(penWidth);
      const [isDrawing, setIsDrawing] = useState(false);

      useEffect(() => {
        penWidthRef.current = penWidth;
      }, [penWidth]);

      useEffect(() => {
        showAnswerRef.current = showAnswer;
      }, [showAnswer]);

      useEffect(() => {
        writingRetryRef.current = writingRetry;
      }, [writingRetry]);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            history,
            excludeCorrect,
            mode,
            showCanvas,
            penWidth,
            hideRecoveredFromIncorrect,
          }));
        } catch (_) {}
      }, [history, excludeCorrect, mode, showCanvas, penWidth, hideRecoveredFromIncorrect]);

      const getDisplayYomi = (question) => {
        if (!question || !question.yomi) return '';
        return Array.isArray(question.yomi) ? question.yomi.join(' / ') : question.yomi;
      };

      const moveToNextQuestion = (currentHistory) => {
        setResult(null);
        setShowAnswer(false);
        setWritingRetry(false);
        setReadingInput('');
        
        if (canvasRef.current && mode === 'writing' && showCanvas && view === 'quiz') {
          initCanvas();
        }

        const list = mode === 'writing' ? writingData : readingData;
        let availableList = list;
        
        if (excludeCorrect) {
          availableList = list.filter(item => currentHistory[item.id]?.status !== 'correct');
        }
        
        if (availableList.length === 0) {
          setCurrentQuestion(null);
          return;
        }

        const randomIndex = Math.floor(Math.random() * availableList.length);
        setCurrentQuestion(availableList[randomIndex]);
      };

      useEffect(() => {
        moveToNextQuestion(history);
      }, [mode, excludeCorrect]);

      const initCanvas = () => {
        const canvas = canvasRef.current;
        const container = containerRef.current;
        if (!canvas || !container) return;

        canvas.width = container.clientWidth;
        canvas.height = canvas.width * 0.7;

        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = penWidthRef.current;
        ctx.strokeStyle = '#2d3748';
      };

      useEffect(() => {
        const handleResize = () => {
          if (view === 'quiz' && mode === 'writing' && showCanvas) initCanvas();
        };
        window.addEventListener('resize', handleResize);
        if (view === 'quiz' && mode === 'writing' && showCanvas && (!showAnswer || writingRetry)) {
          initCanvas();
        }
        return () => window.removeEventListener('resize', handleResize);
      }, [view, mode, showCanvas, currentQuestion, showAnswer, writingRetry]);

      const getCoordinates = (e) => {
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const point = e.touches?.length ? e.touches[0] : e.changedTouches?.length ? e.changedTouches[0] : e;

        return {
          x: (point.clientX - rect.left) * scaleX,
          y: (point.clientY - rect.top) * scaleY,
        };
      };

      const startDrawing = (e) => {
        if (showAnswerRef.current && !writingRetryRef.current) return;
        const { x, y } = getCoordinates(e);
        const ctx = canvasRef.current.getContext('2d');
        ctx.lineWidth = penWidthRef.current;
        ctx.beginPath();
        ctx.moveTo(x, y);
        isDrawingRef.current = true;
        setIsDrawing(true);
      };

      const draw = (e) => {
        if (!isDrawingRef.current || (showAnswerRef.current && !writingRetryRef.current)) return;
        const { x, y } = getCoordinates(e);
        const ctx = canvasRef.current.getContext('2d');
        ctx.lineTo(x, y);
        ctx.stroke();
      };

      const stopDrawing = () => {
        if (isDrawingRef.current) {
          const ctx = canvasRef.current.getContext('2d');
          ctx.closePath();
          isDrawingRef.current = false;
          setIsDrawing(false);
        }
      };

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas || !showCanvas || mode !== 'writing' || view !== 'quiz') return;

        const onTouchStart = (e) => {
          if (showAnswerRef.current && !writingRetryRef.current) return;
          e.preventDefault();
          startDrawing(e);
        };
        const onTouchMove = (e) => {
          if (!isDrawingRef.current) return;
          e.preventDefault();
          draw(e);
        };
        const onTouchEnd = (e) => {
          e.preventDefault();
          stopDrawing();
        };

        canvas.addEventListener('touchstart', onTouchStart, { passive: false });
        canvas.addEventListener('touchmove', onTouchMove, { passive: false });
        canvas.addEventListener('touchend', onTouchEnd, { passive: false });
        canvas.addEventListener('touchcancel', onTouchEnd, { passive: false });

        return () => {
          canvas.removeEventListener('touchstart', onTouchStart);
          canvas.removeEventListener('touchmove', onTouchMove);
          canvas.removeEventListener('touchend', onTouchEnd);
          canvas.removeEventListener('touchcancel', onTouchEnd);
        };
      }, [showCanvas, mode, view, currentQuestion, showAnswer, writingRetry]);

      useEffect(() => {
        if (!isDrawing) return;
        const prevOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        return () => { document.body.style.overflow = prevOverflow; };
      }, [isDrawing]);

      const clearCanvas = () => {
        if (showAnswer && !writingRetry) return;
        initCanvas();
      };

      const handleShowAnswer = () => {
        setShowAnswer(true);
      };

      const handleSelfGrade = (gradeResult) => {
        setResult(gradeResult);
        setHistory(prev => {
          const currentData = prev[currentQuestion.id] || { missCount: 0 };
          const newMissCount = gradeResult === 'incorrect' ? currentData.missCount + 1 : currentData.missCount;
          const nextHistory = { 
            ...prev, 
            [currentQuestion.id]: { status: gradeResult, missCount: newMissCount } 
          };
          if (gradeResult === 'correct') {
            setTimeout(() => moveToNextQuestion(nextHistory), 1000);
          }
          return nextHistory;
        });

        if (gradeResult === 'incorrect') {
          setTimeout(() => {
            setResult(null);
            setWritingRetry(true);
            setShowCanvas(true);
          }, 1000);
        }
      };

      const handleRetryNext = () => {
        moveToNextQuestion(history);
      };

      const handleCheckReading = () => {
        const normalizedInput = readingInput.trim().replace(/[\s　]/g, '');
        const isCorrect = Array.isArray(currentQuestion.yomi) 
          ? currentQuestion.yomi.includes(normalizedInput)
          : currentQuestion.yomi === normalizedInput;
        const gradeResult = isCorrect ? 'correct' : 'incorrect';
        
        setResult(gradeResult);
        setHistory(prev => {
          const currentData = prev[currentQuestion.id] || { missCount: 0 };
          const newMissCount = gradeResult === 'incorrect' ? currentData.missCount + 1 : currentData.missCount;
          return { 
            ...prev, 
            [currentQuestion.id]: { status: gradeResult, missCount: newMissCount } 
          };
        });
        setShowAnswer(true);
      };

      const handleNextClick = () => {
        moveToNextQuestion(history);
      };

      const renderSentence = () => {
        if (!currentQuestion) return null;
        const parts = currentQuestion.sentence.split('{target}');
        const targetText = mode === 'writing' ? getDisplayYomi(currentQuestion) : currentQuestion.kanji;
        
        return (
          <div className="text-xl md:text-2xl tracking-widest mb-8 text-center text-gray-800 leading-relaxed animate-fade-in">
            {parts[0]}
            <span className="font-bold border-b-2 border-gray-900 px-2 mx-1 text-2xl md:text-3xl text-gray-900 inline-block min-w-[80px]">
              {targetText}

            {parts[1]}

      };

      const renderAllClear = () => (
        <div className="p-10 flex flex-col items-center justify-center min-h-[400px] text-center animate-fade-in">
          <div className="mb-6">
            <svg className="w-24 h-24 text-gray-900 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
            </svg>
          </div>
          <h2 className="text-2xl font-bold tracking-widest text-gray-900 mb-4">全問クリア！</h2>
          <p className="text-gray-600 mb-8 leading-relaxed text-sm">
            設定した条件で出題できる問題は<br/>もうありません。
          </p>
          <div className="space-y-4 w-full max-w-xs">
            <button onClick={() => setExcludeCorrect(false)} className="w-full py-4 bg-gray-900 text-white font-bold tracking-widest hover:bg-gray-800 transition-colors shadow-md">
              全問から出題する
            </button>
            <button onClick={() => { setHistory({}); moveToNextQuestion({}); }} className="w-full py-4 bg-white border-2 border-gray-300 text-gray-700 font-bold tracking-widest hover:bg-gray-50 transition-colors">
              学習履歴をリセット
            </button>
          </div>
        </div>
      );

      const renderListView = () => {
        const isIncorrectListItem = (record) => {
          if (!record) return false;
          const hasMiss = record.status === 'incorrect' || record.missCount > 0;
          if (!hasMiss) return false;
          if (hideRecoveredFromIncorrect && record.status === 'correct') return false;
          return true;
        };

        const filterFunc = (item) => {
          const record = history[item.id];
          if (filterTab === 'unanswered') return !record;
          if (filterTab === 'incorrect') return isIncorrectListItem(record);
          if (filterTab === 'correct') return record && record.status === 'correct';
          return true;
        };

        const getEffectiveMissCount = (id) => {
          const record = history[id];
          if (!record) return 0;
          return Math.max(record.missCount, record.status === 'incorrect' ? 1 : 0);
        };

        const sortByMissCount = (list) => {
          if (filterTab !== 'incorrect') return list;
          return [...list].sort((a, b) => getEffectiveMissCount(b.id) - getEffectiveMissCount(a.id));
        };

        const getMissBadgeClass = (count) => {
          if (count >= 5) return 'bg-red-900 border-red-950 text-white';
          if (count >= 4) return 'bg-red-800 border-red-900 text-white';
          if (count >= 3) return 'bg-red-700 border-red-800 text-white';
          if (count >= 2) return 'bg-red-500 border-red-600 text-white';
          return 'bg-red-100 border-red-300 text-red-800';
        };

        const filteredWriting = sortByMissCount(writingData.filter(filterFunc));
        const filteredReading = sortByMissCount(readingData.filter(filterFunc));

        const countTotal = (dataList, type) => {
          return dataList.filter(item => {
            const record = history[item.id];
            if (type === 'unanswered') return !record;
            if (type === 'incorrect') return isIncorrectListItem(record);
            if (type === 'correct') return record && record.status === 'correct';
            return false;
          }).length;
        };

        const writingCount = {
          unanswered: countTotal(writingData, 'unanswered'),
          incorrect: countTotal(writingData, 'incorrect'),
          correct: countTotal(writingData, 'correct')
        };

        const readingCount = {
          unanswered: countTotal(readingData, 'unanswered'),
          incorrect: countTotal(readingData, 'incorrect'),
          correct: countTotal(readingData, 'correct')
        };

        return (
          <div className="p-4 md:p-6 flex flex-col min-h-[500px] animate-fade-in text-gray-900">
            <div className="flex justify-between items-center mb-5">
              <button onClick={() => setView('quiz')} className="text-gray-500 hover:text-gray-900 flex items-center gap-2 font-bold tracking-widest transition-colors text-sm">
                <IconArrowLeft /> 戻る
              </button>
              <h2 className="text-md font-bold tracking-widest text-gray-900">問題一覧・学習設定</h2>
            </div>

            <div className="mb-5 p-4 bg-gray-50 border border-gray-200 rounded-lg space-y-3">
              <label className="flex items-center gap-3 cursor-pointer select-none">
                <input type="checkbox" checked={excludeCorrect} onChange={(e) => setExcludeCorrect(e.target.checked)} className="w-5 h-5 text-gray-900 bg-white border-gray-300 rounded focus:ring-gray-900 focus:ring-offset-0"/>
                <span className="text-gray-900 font-bold tracking-wide text-sm">正解した問題は出題しない</span>
              </label>
              <label className="flex items-center gap-3 cursor-pointer select-none">
                <input type="checkbox" checked={hideRecoveredFromIncorrect} onChange={(e) => setHideRecoveredFromIncorrect(e.target.checked)} className="w-5 h-5 text-gray-900 bg-white border-gray-300 rounded focus:ring-gray-900 focus:ring-offset-0"/>
                <span className="text-gray-900 font-bold tracking-wide text-sm">後に正解した問題を「間違えた」一覧から除外</span>
              </label>
            </div>

            <div className="flex border-b border-gray-300 mb-5 bg-[#fafafa] rounded-t-md">
              <button onClick={() => setFilterTab('unanswered')} className={`flex-1 py-3 text-xs tracking-wider transition-colors font-bold border-b-2 flex flex-col items-center justify-center gap-1 ${filterTab === 'unanswered' ? 'border-gray-900 text-gray-900 bg-white' : 'border-transparent text-gray-500 hover:bg-gray-100'}`}>
                <span>未回答</span>
                <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-gray-200 text-gray-700 font-medium">{writingCount.unanswered + readingCount.unanswered}</span>
              </button>
              <button onClick={() => setFilterTab('incorrect')} className={`flex-1 py-3 text-xs tracking-wider transition-colors font-bold border-b-2 flex flex-col items-center justify-center gap-1 ${filterTab === 'incorrect' ? 'border-gray-900 text-gray-900 bg-white' : 'border-transparent text-gray-500 hover:bg-gray-100'}`}>
                <span>間違えた</span>
                <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-red-100 text-red-700 font-medium">{writingCount.incorrect + readingCount.incorrect}</span>
              </button>
              <button onClick={() => setFilterTab('correct')} className={`flex-1 py-3 text-xs tracking-wider transition-colors font-bold border-b-2 flex flex-col items-center justify-center gap-1 ${filterTab === 'correct' ? 'border-gray-900 text-gray-900 bg-white' : 'border-transparent text-gray-500 hover:bg-gray-100'}`}>
                <span>正解した</span>
                <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-green-100 text-green-700 font-medium">{writingCount.correct + readingCount.correct}</span>
              </button>
            </div>

            <div className="flex-1 max-h-[380px] overflow-y-auto pr-1 space-y-6 scrollbar-thin">
              <div>
                <h3 className="font-bold text-gray-900 border-b border-gray-200 pb-1.5 mb-3 tracking-widest text-sm flex items-center justify-between">
                  <span>書き問題</span>
                  <span className="text-xs text-gray-500 font-normal">{filteredWriting.length} 件</span>
                </h3>
                {filteredWriting.length === 0 ? <p className="text-gray-400 text-xs text-center py-4">該当問題はありません。</p> : (
                  <ul className="space-y-1">
                    {filteredWriting.map(item => {
                      const record = history[item.id];
                      return (
                        <li key={item.id} className="flex justify-between items-center py-2.5 border-b border-gray-100 hover:bg-gray-50 px-2 rounded transition-colors text-sm">
                          <div className="flex-1 min-w-0 pr-2">
                            <span className="text-gray-500 text-xs block mb-0.5 truncate">{getDisplayYomi(item)}</span>
                            <span className="font-bold text-lg text-gray-900 tracking-wide">{item.kanji}</span>
                          </div>
                          <div className="flex items-center gap-2 justify-end shrink-0">
                            {(() => {
                              const miss = getEffectiveMissCount(item.id);
                              return miss > 0 ? (
                                <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded shadow-sm border ${getMissBadgeClass(miss)}`}>
                                  ミス {miss}回
                                </span>
                              ) : null;
                            })()}
                            <div className="w-6 flex justify-center shrink-0">
                              {record?.status === 'correct' && <IconCheckCircle />}
                            </div>
                          </div>
                        </li>
                      );
                    })}
                  </ul>
                )}
              </div>

              <div>
                <h3 className="font-bold text-gray-900 border-b border-gray-200 pb-1.5 mb-3 tracking-widest text-sm flex items-center justify-between">
                  <span>読み問題</span>
                  <span className="text-xs text-gray-500 font-normal">{filteredReading.length} 件</span>
                </h3>
                {filteredReading.length === 0 ? <p className="text-gray-400 text-xs text-center py-4">該当問題はありません。</p> : (
                  <ul className="space-y-1">
                    {filteredReading.map(item => {
                      const record = history[item.id];
                      return (
                        <li key={item.id} className="flex justify-between items-center py-2.5 border-b border-gray-100 hover:bg-gray-50 px-2 rounded transition-colors text-sm">
                          <div className="flex-1 min-w-0 pr-2">
                            <span className="font-bold text-lg text-gray-900 tracking-wide block mb-0.5">{item.kanji}</span>
                            <span className="text-gray-600 text-xs truncate block">{getDisplayYomi(item)}</span>
                          </div>
                          <div className="flex items-center gap-2 justify-end shrink-0">
                            {(() => {
                              const miss = getEffectiveMissCount(item.id);
                              return miss > 0 ? (
                                <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded shadow-sm border ${getMissBadgeClass(miss)}`}>
                                  ミス {miss}回
                                </span>
                              ) : null;
                            })()}
                            <div className="w-6 flex justify-center shrink-0">
                              {record?.status === 'correct' && <IconCheckCircle />}
                            </div>
                          </div>
                        </li>
                      );
                    })}
                  </ul>
                )}
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-[#f8f9fa] text-gray-800 p-4 flex justify-center items-start selection:bg-gray-200">
          <style>{`
            * { font-family: 'Zen Kaku Gothic New', sans-serif; }
            @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
            .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
            @keyframes scaleIn { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.85; } }
            .animate-scale-in { animation: scaleIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
            .scrollbar-thin::-webkit-scrollbar { width: 5px; }
            .scrollbar-thin::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 9px; }
            .canvas-draw-area { touch-action: none; overscroll-behavior: contain; -webkit-user-select: none; user-select: none; }
          `}</style>

          <div className="w-full max-w-lg bg-white border border-gray-300 mt-2 md:mt-10 mb-10 relative overflow-hidden shadow-sm">
            <div className="p-4 border-b border-gray-300 flex justify-between items-center bg-white">
              <div className="w-10"></div>
              <h1 className="text-xl tracking-widest font-bold text-gray-900">中間テスト 漢字練習</h1>
              <button onClick={() => setView(view === 'list' ? 'quiz' : 'list')} className="w-10 h-10 flex items-center justify-center text-gray-500 hover:text-gray-900 hover:bg-gray-100 rounded-full transition-colors">
                {view === 'list' ? <IconX /> : <IconList />}
              </button>
            </div>

            {view === 'list' ? renderListView() : (
              <>
                <div className="flex border-b border-gray-300 bg-[#fafafa]">
                  <button className={`flex-1 py-3 text-sm tracking-widest transition-colors flex items-center justify-center gap-2 ${mode === 'writing' ? 'border-b-2 border-gray-900 font-bold bg-white text-gray-900' : 'text-gray-500 hover:bg-gray-100'}`} onClick={() => setMode('writing')}>
                    <IconEdit2 /> 書き問題
                  </button>
                  <button className={`flex-1 py-3 text-sm tracking-widest transition-colors flex items-center justify-center gap-2 ${mode === 'reading' ? 'border-b-2 border-gray-900 font-bold bg-white text-gray-900' : 'text-gray-500 hover:bg-gray-100'}`} onClick={() => setMode('reading')}>
                    <IconType /> 読み問題
                  </button>
                </div>

                {!currentQuestion ? renderAllClear() : (
                  <div className="p-6 md:p-10 flex flex-col items-center min-h-[500px] relative animate-fade-in">
                    <p className="text-gray-500 text-sm mb-6 tracking-wide text-center">
                      {mode === 'writing' ? '下線部のひらがなを漢字で書きなさい。' : '下線部の漢字の読みをひらがなで答えなさい。'}
                    </p>

                    {renderSentence()}
                    
                    {result && (
                      <div className="absolute top-[40%] left-1/2 pointer-events-none z-10 animate-scale-in">
                        <GradeMark type={result} />
                      </div>
                    )}
                    
                    {mode === 'writing' ? (
                      <div className="w-full mb-4">
                        <div className="flex justify-between items-center gap-3 mb-2">
                          {showCanvas && (!showAnswer || writingRetry) ? (
                            <div className="flex items-center gap-2 flex-1 min-w-0">
                              <span className="text-xs text-gray-500 shrink-0 tracking-wide">太さ</span>
                              <input
                                type="range"
                                min="2"
                                max="24"
                                step="1"
                                value={penWidth}
                                onChange={(e) => setPenWidth(Number(e.target.value))}
                                className="flex-1 min-w-0 h-1 accent-gray-900 cursor-pointer"
                              />
                              <span className="text-xs text-gray-600 w-6 text-right tabular-nums">{penWidth}</span>
                            </div>
                          ) : (
                            <div className="flex-1" />
                          )}
                          <button onClick={() => setShowCanvas(!showCanvas)} className="text-xs text-gray-500 hover:text-gray-900 flex items-center gap-1.5 p-1 shrink-0">
                            {showCanvas ? <IconPenOff /> : <IconPenOn />}
                            {showCanvas ? '手書きを隠す' : '手書きを開く'}
                          </button>
                        </div>
                        
                        {writingRetry && (
                          <p className="text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded px-3 py-2 mb-2 text-center tracking-wide">
                            正解の漢字を手書きエリアにもう一度書いてみましょう
                          </p>
                        )}

                        {showCanvas && (
                          <div className="w-full relative animate-fade-in canvas-draw-area" ref={containerRef}>
                            <div className={`border ${showAnswer && !writingRetry ? 'border-gray-200' : 'border-gray-400'}`}>
                              <canvas
                                ref={canvasRef}
                                className={`block w-full bg-white ${showAnswer && !writingRetry ? 'opacity-50' : 'cursor-crosshair'}`}
                                onMouseDown={startDrawing}
                                onMouseMove={draw}
                                onMouseUp={stopDrawing}
                                onMouseLeave={stopDrawing}
                              />
                            </div>
                            {(!showAnswer || writingRetry) && (
                              <button onClick={clearCanvas} className="absolute -top-3 -right-3 p-2 bg-white border border-gray-300 text-gray-500 hover:text-gray-800 shadow-sm">
                                <IconRefresh />
                              </button>
                            )}
                          </div>
                        )}
                      </div>
                    ) : (
                      <div className="w-full mb-8">
                        <input 
                          type="text" 
                          value={readingInput}
                          onChange={(e) => setReadingInput(e.target.value)}
                          onKeyDown={(e) => e.key === 'Enter' && !showAnswer && handleCheckReading()}
                          className="w-full border-b-2 border-gray-300 p-4 text-2xl tracking-widest text-center focus:outline-none focus:border-gray-900 bg-transparent"
                          placeholder="ひらがなを入力"
                          disabled={showAnswer}
                          autoFocus
                        />
                      </div>
                    )}

                    <div className="w-full mt-auto">
                      {mode === 'writing' && !showAnswer && (
                        <button onClick={handleShowAnswer} className="w-full py-4 bg-gray-900 text-white font-bold tracking-widest hover:bg-gray-800 shadow-md">
                          正解を見る
                        </button>
                      )}

                      {mode === 'writing' && showAnswer && (
                        <div className="w-full animate-fade-in">
                          {writingRetry ? (
                            <>
                              <div className="text-center mb-4">
                                <p className="text-sm text-gray-500 mb-1">正解</p>
                                <p className="text-5xl font-bold tracking-widest text-gray-900">{currentQuestion.kanji}</p>
                              </div>
                              <button onClick={handleRetryNext} className="w-full py-4 bg-white border-2 border-gray-900 text-gray-900 font-bold tracking-widest flex items-center justify-center gap-3">
                                次の問題へ <IconArrowRight />
                              </button>
                            </>
                          ) : (
                            <>
                              <div className="text-center mb-6">
                                <p className="text-sm text-gray-500 mb-1">正解</p>
                                <p className="text-5xl font-bold tracking-widest text-gray-900">{currentQuestion.kanji}</p>
                              </div>
                              {!result && (
                                <div className="flex gap-4 w-full">
                                  <button onClick={() => handleSelfGrade('incorrect')} className="flex-1 py-4 bg-white border-2 border-gray-300 text-gray-600 font-bold tracking-widest flex items-center justify-center gap-2"><IconX /> 間違えた</button>
                                  <button onClick={() => handleSelfGrade('correct')} className="flex-1 py-4 bg-gray-900 border-2 border-gray-900 text-white font-bold tracking-widest flex items-center justify-center gap-2 shadow-md"><IconCheck /> 正解できた</button>
                                </div>
                              )}
                            </>
                          )}
                        </div>
                      )}

                      {mode === 'reading' && !showAnswer && (
                        <button onClick={handleCheckReading} disabled={!readingInput.trim()} className="w-full py-4 bg-gray-900 text-white font-bold tracking-widest hover:bg-gray-800 disabled:bg-gray-300 disabled:text-gray-500 shadow-md">
                          判定する
                        </button>
                      )}

                      {mode === 'reading' && showAnswer && (
                        <div className="w-full animate-fade-in">
                          <div className="text-center mb-6">
                            <p className="text-sm text-gray-500 mb-1">正解</p>
                            <p className="text-2xl font-bold tracking-widest text-gray-900">{getDisplayYomi(currentQuestion)}</p>
                          </div>
                          <button onClick={handleNextClick} className="w-full py-4 bg-white border-2 border-gray-900 text-gray-900 font-bold tracking-widest flex items-center justify-center gap-3">
                            次の問題へ <IconArrowRight />
                          </button>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
