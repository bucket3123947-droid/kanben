# main への push ごとに Cloudflare へ静的ファイルをデプロイします。
# リポジトリの Settings → Secrets に以下を登録してください:
#   CLOUDFLARE_API_TOKEN  … Workers 編集権限付き API トークン
#   CLOUDFLARE_ACCOUNT_ID … Cloudflare ダッシュボード右サイドバーの Account ID

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
